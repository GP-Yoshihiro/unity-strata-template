# Project-scoped Codex settings (applied when this project is trusted in Codex).
# Local-model (Strata) settings cannot live here -- Codex ignores model_providers/profiles in
# project config. They are in .codex-local/config.toml, used by tools\codex-local.cmd.

approval_policy = "on-request"
sandbox_mode = "workspace-write"

[sandbox_workspace_write]
# Unity Package Manager resolves packages over the network during batch runs.
network_access = true
