name: checks

# Repository-level safety checks that do not need a Unity licence.
# (Unity tests run locally / on a self-hosted runner: tools/unity.* test All)
on:
  pull_request:
  push:
    branches: [main]

jobs:
  repo-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: Unity .meta consistency
        run: bash tools/check-meta.sh

      - name: Context index up to date
        shell: pwsh
        run: ./tools/strata-index.ps1 -Verify

      - name: Task files are valid
        shell: pwsh
        run: |
          $ok = $true
          Get-ChildItem Tasks/items -Filter 'T-*.json' | ForEach-Object {
            try {
              $t = Get-Content $_.FullName -Raw | ConvertFrom-Json
              if ($t.id + '.json' -ne $_.Name) { throw "id '$($t.id)' does not match file name" }
              if ($t.status -notin 'todo','doing','review','done','blocked') { throw "bad status '$($t.status)'" }
            } catch { Write-Host "::error file=$($_.FullName)::$_"; $ok = $false }
          }
          if (-not $ok) { exit 1 }

      - name: Commits carry a Task trailer (PRs from task branches)
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'task/')
        run: |
          missing=$(git log --no-merges --format='%h %s%n%(trailers:key=Task,valueonly)' origin/${{ github.base_ref }}..HEAD | awk 'NF==0{next} /^[0-9a-f]{7,} /{h=$0; getline t; if (t !~ /^T-/) print h}')
          if [ -n "$missing" ]; then echo "Commits without 'Task:' trailer:"; echo "$missing"; exit 1; fi

      - name: Shell scripts are executable and parse; cmd wrappers are cmd syntax
        run: |
          bad=0
          for f in $(git ls-files 'tools/*.sh' '.githooks/*'); do
            mode=$(git ls-files -s -- "$f" | cut -d' ' -f1)
            [ "$mode" = 100755 ] || { echo "::error file=$f::not executable in git (git update-index --chmod=+x $f)"; bad=1; }
            bash -n "$f" || { echo "::error file=$f::bash syntax error"; bad=1; }
          done
          # cmd.exe has no /dev/null: ">/dev/null" creates a file named \dev\null on the current drive
          if grep -n '/dev/null' tools/*.cmd; then echo "::error::use >nul in .cmd files"; bad=1; fi
          exit $bad

      - name: PowerShell scripts are ASCII (Windows PowerShell 5.1 safe)
        run: |
          if grep -rnP '[^\x00-\x7F]' --include='*.ps1' --include='*.psm1' tools; then
            echo "Non-ASCII characters in PowerShell scripts (Windows PowerShell 5.1 misreads BOM-less UTF-8)"; exit 1
          fi

      - name: PowerShell scripts parse
        shell: pwsh
        run: |
          $bad = $false
          Get-ChildItem tools -Recurse -Filter *.ps1 | ForEach-Object {
            $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errs)
            foreach ($e in $errs) { Write-Host "::error file=$($_.FullName),line=$($e.Extent.StartLineNumber)::$($e.Message)"; $bad = $true }
          }
          if ($bad) { exit 1 }
